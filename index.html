            --bg-main: #18191a;
            --bg-card: #242526;
            --bg-hover: #3a3b3c;
            --accent-gray: #b0b3b8;
            --text-light: #e4e6eb;
            --text-white: #ffffff;
            --danger: #e53935;
            --success: #4caf50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background-color: var(--bg-card); padding: 1rem 2rem; display: flex;
            justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 4px 10px rgba(0,0,0,0.3);

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--text-white); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .cart-icon-btn { position: relative; background: none; border: none; color: var(--text-light); font-size: 1.4rem; cursor: pointer; }
        .cart-count { position: absolute; top: -8px; left: -8px; background-color: var(--text-white); color: var(--bg-main); font-size: 0.75rem; font-weight: bold; width: 20px; height: 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }

        .container { max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem; flex: 1; width: 100%; }
        .back-btn { background: var(--bg-card); color: var(--text-light); border: 1px solid var(--bg-hover); padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; margin-bottom: 1.5rem; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .back-btn:hover { background: var(--bg-hover); }

        .products-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.2rem; }
        @media (max-width: 1200px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (max-width: 900px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 650px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 420px) { .products-grid { grid-template-columns: repeat(1, 1fr); } }

        .product-card { background-color: var(--bg-card); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); }
        .product-img { width: 100%; height: 180px; object-fit: cover; background-color: var(--bg-hover); }

        .product-info { padding: 1rem; display: flex; flex-direction: column; flex: 1; justify-content: space-between; }
        .product-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-white); }
        .product-price { font-size: 1.1rem; color: var(--text-white); font-weight: bold; margin-bottom: 0.8rem; }

        .btn-group { display: flex; gap: 8px; margin-top: 10px; }
        .add-to-cart-btn { background-color: var(--bg-hover); color: var(--text-light); border: 1px solid var(--accent-gray); padding: 0.7rem; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 0.9rem; flex: 1; font-weight: bold; transition: 0.2s; }
        .add-to-cart-btn:hover { background-color: var(--accent-gray); color: var(--bg-main); }
        
        .buy-now-btn { background-color: var(--text-white); color: var(--bg-main); border: none; padding: 0.7rem; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 0.9rem; flex: 1; font-weight: bold; transition: 0.2s; }
        .buy-now-btn:hover { background-color: #e0e0e0; }

        .product-detail-view { display: grid; grid-template-columns: 1fr 1fr; gap: 2.5rem; background: var(--bg-card); padding: 2rem; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); }
        @media (max-width: 768px) { .product-detail-view { grid-template-columns: 1fr; } }

        .gallery-container { display: flex; flex-direction: column; gap: 1rem; }
        .main-img-wrapper { position: relative; width: 100%; height: 380px; border-radius: 12px; overflow: hidden; background: var(--bg-hover); }
        .detail-img { width: 100%; height: 100%; object-fit: cover; }

        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: white; border: none; padding: 10px; cursor: pointer; border-radius: 50%; font-size: 1.2rem; }
        .slider-btn.prev { left: 10px; }
        .slider-btn.next { right: 10px; }

        .thumbnails-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }
        .thumb-img { width: 65px; height: 65px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 2px solid transparent; opacity: 0.6; }
        .thumb-img.active { border-color: var(--text-white); opacity: 1; }

        .detail-info { display: flex; flex-direction: column; gap: 1.2rem; }
        .detail-title { font-size: 1.8rem; color: var(--text-white); }
        .detail-price { font-size: 1.6rem; font-weight: bold; color: var(--text-white); }
        .detail-desc { color: var(--accent-gray); line-height: 1.6; font-size: 1rem; }

        .checkout-page-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 2rem; }
        @media (max-width: 850px) { .checkout-page-grid { grid-template-columns: 1fr; } }

        .checkout-card { background: var(--bg-card); padding: 1.8rem; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .checkout-title { font-size: 1.3rem; margin-bottom: 1.5rem; color: var(--text-white); border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 0.8rem; display: flex; align-items: center; gap: 10px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        @media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 1rem; }
        .form-group label { font-size: 0.88rem; color: var(--accent-gray); }
        .form-group input, .form-group select, .form-group textarea { background: var(--bg-main); border: 1px solid var(--bg-hover); padding: 0.8rem; border-radius: 8px; color: var(--text-white); font-size: 0.95rem; }

        .radio-group { display: flex; gap: 1.5rem; background: var(--bg-main); padding: 0.8rem; border-radius: 8px; border: 1px solid var(--bg-hover); }
        .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-light); }

        .summary-item { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        .summary-img { width: 65px; height: 65px; border-radius: 10px; object-fit: cover; }

        .price-breakdown { background: var(--bg-main); padding: 1rem; border-radius: 8px; margin-top: 1rem; border: 1px solid var(--bg-hover); }
        .price-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .price-row.total { font-weight: bold; font-size: 1.15rem; color: var(--text-white); border-top: 1px solid var(--bg-hover); padding-top: 0.5rem; margin-top: 0.5rem; }

        .cart-overlay { position: fixed; top: 0; right: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s; }
        .cart-overlay.active { opacity: 1; pointer-events: all; }
        .cart-sidebar { position: fixed; top: 0; left: -400px; width: 100%; max-width: 380px; height: 100%; background-color: var(--bg-card); z-index: 201; transition: 0.3s; display: flex; flex-direction: column; }
        .cart-sidebar.active { left: 0; }
        .cart-header { padding: 1.2rem; background-color: var(--bg-main); display: flex; justify-content: space-between; align-items: center; }
        .close-cart { background: none; border: none; color: var(--accent-gray); font-size: 1.5rem; cursor: pointer; }
        .cart-items { flex: 1; overflow-y: auto; padding: 1rem; }
        
        .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1rem; }
        .cart-item-details { display: flex; align-items: center; gap: 0.8rem; flex: 1; }
        .cart-item-img { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; }
        .cart-item-title { font-size: 0.9rem; font-weight: bold; color: var(--text-white); margin-bottom: 4px; }
        .cart-item-price { font-size: 0.85rem; color: var(--accent-gray); }

        .qty-controls { display: flex; align-items: center; gap: 6px; background: var(--bg-main); padding: 3px 6px; border-radius: 6px; border: 1px solid var(--bg-hover); margin-top: 5px; }
        .qty-btn { background: var(--bg-hover); border: none; color: var(--text-white); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .qty-val { font-size: 0.85rem; font-weight: bold; min-width: 16px; text-align: center; }

        .remove-cart-item { background: none; border: none; color: var(--danger); font-size: 1.1rem; cursor: pointer; padding: 5px; opacity: 0.8; transition: 0.2s; }
        .remove-cart-item:hover { opacity: 1; transform: scale(1.1); }

        .cart-footer { padding: 1.5rem; background-color: var(--bg-main); }
        .checkout-btn { width: 100%; padding: 0.8rem; background-color: var(--text-white); color: var(--bg-main); border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

        footer { text-align: center; padding: 1.5rem; background-color: var(--bg-card); color: var(--accent-gray); margin-top: 3rem; position: relative; }
        .hidden-admin-btn { position: absolute; left: 15px; bottom: 15px; color: rgba(255, 255, 255, 0.08); cursor: pointer; }
    </style>
</head>

                                    <label>الاسم الكامل *</label>
                                    <input type="text" id="custName" required placeholder="أدخل اسمك الكامل">
                                </div>
                                <div class="form-group">
                                    <label>رقم الهاتف *</label>
                                    <input type="tel" id="custPhone" required placeholder="06XXXXXXXX">
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>الولاية *</label>
                                    <select id="wilayaSelect" required onchange="calculateTotalCost(${itemsSubtotal})">
                                        <option value="" disabled selected>اختر الولاية...</option>
                                        ${Object.keys(deliveryRates).map(id => `<option value="${id}">${deliveryRates[id].name}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>البلدية *</label>
                                    <input type="text" id="custCommune" required placeholder="أدخل اسم البلدية">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>مكان التوصيل *</label>
                                <div class="radio-group">
                                    <label class="radio-option">
                                        <input type="radio" name="deliveryType" value="home" checked onchange="calculateTotalCost(${itemsSubtotal})"> توصيل للمنزل
                                    </label>
                                    <label class="radio-option">
                                        <input type="radio" name="deliveryType" value="office" onchange="calculateTotalCost(${itemsSubtotal})"> استلام من المكتب
                                    </label>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>ملاحظات إضافية (اختياري)</label>
                                <textarea id="custNotes" rows="2" placeholder="أكتب ملاحظاتك للموزع هنا (مثال: الاتصال قبل الوصول)..."></textarea>
                            </div>

                            <button type="submit" class="checkout-btn" style="padding: 1rem; margin-top: 1rem; font-size: 1.05rem;">
                                <i class="fa-solid fa-check-circle"></i> تأكيد الشراء الآن (الدفع عند الاستلام)
                            </button>
                        </form>
                    </div>
                </div>
            `;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function calculateTotalCost(itemsSubtotal) {
            const wilayaSelect = document.getElementById('wilayaSelect');
            if (!wilayaSelect) return;
            const wilayaId = wilayaSelect.value;
            const deliveryType = document.querySelector('input[name="deliveryType"]:checked').value;
            
            const deliveryCostDisplay = document.getElementById('deliveryCostDisplay');
            const totalCostDisplay = document.getElementById('totalCostDisplay');

            const deliveryRates = getDeliveryRates();

            if (wilayaId && deliveryRates[wilayaId]) {
                const deliveryFee = deliveryRates[wilayaId][deliveryType];
                const total = itemsSubtotal + deliveryFee;
                deliveryCostDisplay.textContent = `${deliveryFee} د.ج`;
                totalCostDisplay.textContent = `${total} د.ج`;
            } else {
                deliveryCostDisplay.textContent = `-- د.ج`;
                totalCostDisplay.textContent = `${itemsSubtotal} د.ج`;
            }
        }

        async function sendOrderToTelegram(orderData) {
            let productsText = "";
            orderData.items.forEach((item, index) => {
                productsText += `${index + 1}. *${item.name}* \n   الكمية: ${item.qty} | السعر: ${item.price} د.ج\n`;
            });

            const message = `🛍️ *طلب جديد من المتجر!*

👤 *معلومات الزبون:*
• *الاسم:* ${orderData.name}
• *الهاتف:* ${orderData.phone}
• *الولاية:* ${orderData.wilaya}
• *البلدية:* ${orderData.commune}
• *نوع التوصيل:* ${orderData.deliveryType === 'home' ? 'توصيل للمنزل 🏠' : 'استلام من المكتب 🏢'}
• *ملاحظات:* ${orderData.notes || 'لا يوجد'}

📦 *المنتجات المطلوبة:*
${productsText}
💰 *الحساب:*
• *مجموع المنتجات:* ${orderData.itemsSubtotal} د.ج
• *تكلفة التوصيل:* ${orderData.deliveryCost}
• *المجموع النهائي:* ${orderData.totalCost}`;

            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (error) {
                console.error("خطأ في إرسال الطلب إلى تلجرام:", error);
            }
        }

        function confirmOrder(e) {
            e.preventDefault();
            const totalItemsCount = checkoutCartItems.reduce((s, i) => s + i.qty, 0);

            const wilayaSelect = document.getElementById('wilayaSelect');
            const wilayaId = wilayaSelect ? wilayaSelect.value : '';
            const deliveryRates = getDeliveryRates();
            const wilayaName = (wilayaId && deliveryRates[wilayaId]) ? deliveryRates[wilayaId].name : 'غير محدد';
            
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const commune = document.getElementById('custCommune').value;
            const deliveryType = document.querySelector('input[name="deliveryType"]:checked').value;
            const notes = document.getElementById('custNotes').value;
            
            const deliveryCostDisplay = document.getElementById('deliveryCostDisplay').textContent;
            const totalCostDisplay = document.getElementById('totalCostDisplay').textContent;
            const itemsSubtotal = checkoutCartItems.reduce((sum, item) => sum + (item.price * item.qty), 0);

            const orderDetails = {
                name,
                phone,
                wilaya: wilayaName,
                commune,
                deliveryType,
                notes,
                items: checkoutCartItems,
                itemsSubtotal,
                deliveryCost: deliveryCostDisplay,
                totalCost: totalCostDisplay
            };

            sendOrderToTelegram(orderDetails);

            alert(`شكراً لك! تم تسجيل طلبك بـ (${totalItemsCount}) منتج/منتجات بنجاح.\nسيتم الاتصال بك هاتفياً لتأكيد العنوان والتوصيل.`);
            cart = [];
            updateCart();
            showProductsList();
        }

        function addToCart(id) {
            storeProducts = getProducts();
            const p = storeProducts.find(item => item.id === id);
            if (p) {
                const existingIdx = cart.findIndex(item => item.id === id);
                if (existingIdx > -1) {
                    cart[existingIdx].qty += 1;
                } else {
                    cart.push({ ...p, qty: 1 });
                }
                updateCart(); 
                openCartUI(); 
            }
        }

        function changeCartQty(id, delta) {
            const idx = cart.findIndex(item => item.id === id);
            if (idx > -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) {
                    cart.splice(idx, 1);
                }
                updateCart();
            }
        }

        function removeFromCart(id) {
            cart = cart.filter(item => item.id !== id);
            updateCart();
        }

        function proceedToCheckoutFromCart() {
            if (cart.length === 0) {
                alert("السلة فارغة حالياً!");
                return;
            }
            goToCheckout(cart);
        }

        function updateCart() {
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').textContent = totalCount;
            
            const itemsCont = document.getElementById('cartItems');
            if (cart.length === 0) {
                itemsCont.innerHTML = `<div style="text-align:center; color:var(--accent-gray); padding: 2rem 0;">السلة فارغة حالياً</div>`;
            } else {
                itemsCont.innerHTML = cart.map(i => {
                    const img = i.images ? i.images[0] : i.image;
                    return `
                        <div class="cart-item">
                            <div class="cart-item-details">
                                <img src="${img}" class="cart-item-img">
                                <div>
                                    <div class="cart-item-title">${i.name}</div>
                                    <div class="cart-item-price">${i.price} د.ج</div>
                                    <div class="qty-controls">
                                        <button class="qty-btn" onclick="changeCartQty(${i.id}, -1)">-</button>
                                        <span class="qty-val">${i.qty}</span>
                                        <button class="qty-btn" onclick="changeCartQty(${i.id}, 1)">+</button>
                                    </div>
                                </div>
                            </div>
                            <button class="remove-cart-item" onclick="removeFromCart(${i.id})" title="إزالة من السلة">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                }).join('');
            }

            const grandTotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
            document.getElementById('cartTotal').textContent = `${grandTotal} د.ج`;
        }

        function openCartUI() { document.getElementById('cartSidebar').classList.add('active'); document.getElementById('cartOverlay').classList.add('active'); }
        function closeCartUI() { document.getElementById('cartSidebar').classList.remove('active'); document.getElementById('cartOverlay').classList.remove('active'); }

        document.getElementById('cartBtn').onclick = openCartUI;
        document.getElementById('closeCart').onclick = closeCartUI;
        document.getElementById('cartOverlay').onclick = closeCartUI;

        showProductsList();
    </script>
</body>
</html>
